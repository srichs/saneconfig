[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "saneconfig"
version = "0.1.0"
description = "Dead-simple typed config loader for dataclasses (defaults + TOML + env) with great errors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["config", "settings", "dataclasses", "env", "toml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yourname/saneconfig"
Issues = "https://github.com/yourname/saneconfig/issues"

[project.optional-dependencies]
docs = [
  "sphinx>=7,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saneconfig"]

[tool.ruff]
line-length = 100


[tool.black]
line-length = 100
target-version = ["py311"]
